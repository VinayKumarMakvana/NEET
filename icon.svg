<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0f172a"/>
  <!-- Medical Cross / Shield background -->
  <path d="M 50 14 L 78 26 C 78 54 50 78 50 86 C 50 78 22 54 22 26 Z" fill="url(#medGrad)" opacity="0.2"/>
  <!-- Caduceus / Rod of Asclepius & Stethoscope -->
  <path d="M 50 20 L 50 80" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="18" r="5" fill="url(#goldGrad)"/>
  <!-- Snake / Double Helix Ribbon -->
  <path d="M 36 34 C 42 26, 58 26, 64 34 C 68 40, 32 46, 36 54 C 42 62, 58 62, 64 70" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pulse / ECG Heartbeat -->
  <path d="M 28 50 L 38 50 L 44 38 L 52 64 L 58 46 L 64 50 L 72 50" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
